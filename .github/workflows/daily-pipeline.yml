name: Daily Digest Pipeline

on:
  schedule:
    # Fixed daily trigger for Phase 1 (US-3 configurable send time is
    # Phase 2 — see feature-implementation-plan.md). 12:00 UTC is a
    # placeholder; adjust to your preferred send time before relying on
    # this, since GitHub Actions cron has no per-user config surface.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      backfill_period_date:
        description: "Optional: generate a digest for one specific historical day (YYYY-MM-DD) instead of the normal since-last-digest window. Leave blank for a normal run."
        required: false
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        working-directory: pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DAILY_SPEND_CEILING_USD: ${{ vars.DAILY_SPEND_CEILING_USD }}
          BACKFILL_PERIOD_DATE: ${{ inputs.backfill_period_date }}
        run: python orchestrator.py

